name: Deploy Kunst-Galerie zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages konfigurieren (aktiviert Pages automatisch)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Repo-Root deployen (nicht art/): der Branch-Quelle-Build von Pages serviert
      # ebenfalls den Repo-Root — beide Deploys liefern so dasselbe URL-Schema
      # (…/art/…), statt sich gegenseitig das Schema zu kippen.
      - name: Repo-Root als Artefakt hochladen (index.html leitet nach art/ um)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
